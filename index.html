<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000011">
    <title>Riftline Racing</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <canvas id="application-canvas"></canvas>

    <div id="ui-overlay">

        <!-- HUD (shown during racing) -->
        <div id="hud" class="hidden">
            <div id="hud-top">
                <div id="lap-display">
                    <span class="hud-label">LAP</span>
                    <span id="lap-count">1 / 3</span>
                </div>
                <div id="timer-display">
                    <span id="race-timer">0:00.000</span>
                </div>
                <div id="position-display">
                    <span class="hud-label">POS</span>
                    <span id="race-position">1<sup>st</sup></span>
                </div>
            </div>

            <div id="hud-bottom">
                <div id="speedometer">
                    <div id="speed-arc-container">
                        <svg id="speed-arc" viewBox="0 0 120 70" width="120" height="70">
                            <path d="M10,65 A55,55 0 0,1 110,65" fill="none" stroke="#1a1a3e" stroke-width="8"/>
                            <path id="speed-arc-fill" d="M10,65 A55,55 0 0,1 110,65" fill="none" stroke="#00f0ff" stroke-width="8" stroke-dasharray="0 173"/>
                        </svg>
                        <div id="speed-readout">
                            <span id="speed-value">0</span>
                            <span class="unit">MPH</span>
                        </div>
                    </div>
                </div>

                <div id="nitro-panel">
                    <div id="nitro-bar-track">
                        <div id="nitro-bar-fill"></div>
                    </div>
                    <span class="hud-label">NITRO</span>
                </div>
            </div>

            <div id="active-powerup" class="hidden">
                <span id="powerup-icon">⚡</span>
                <div id="powerup-timer-bar"><div id="powerup-timer-fill"></div></div>
            </div>

            <div id="wrong-way-banner" class="hidden">⚠ WRONG WAY ⚠</div>
            <div id="lap-flash" class="hidden"></div>

            <canvas id="minimap" width="160" height="160"></canvas>
        </div>

        <!-- Touch Controls -->
        <div id="touch-controls" class="hidden">
            <div id="touch-left" class="touch-zone left-zone">
                <div class="touch-btn steer-btn" id="btn-left">◀</div>
            </div>
            <div id="touch-right" class="touch-zone right-zone">
                <div class="touch-btn steer-btn" id="btn-right">▶</div>
            </div>
            <div id="touch-actions">
                <button class="touch-btn action-btn" id="btn-accel">▲</button>
                <button class="touch-btn action-btn" id="btn-brake">▼</button>
                <button class="touch-btn nitro-btn" id="btn-nitro">⚡</button>
            </div>
        </div>

        <!-- Countdown -->
        <div id="countdown" class="hidden">
            <span id="countdown-text">3</span>
        </div>

        <!-- Main Menu -->
        <div id="screen-menu">
            <div id="logo-wrap">
                <div id="logo-rift">RIFT</div>
                <div id="logo-line">LINE</div>
                <div id="logo-racing">RACING</div>
            </div>
            <div id="menu-buttons">
                <button class="menu-btn" id="btn-career">CAREER</button>
                <button class="menu-btn" id="btn-quickrace">QUICK RACE</button>
                <button class="menu-btn secondary" id="btn-garage">GARAGE</button>
            </div>
            <div id="save-info"></div>
        </div>

        <!-- Career City Select -->
        <div id="screen-career" class="hidden">
            <div class="screen-header">
                <button class="back-btn" id="career-back">←</button>
                <h2>SELECT CITY</h2>
                <span id="career-wins-total"></span>
            </div>
            <div id="city-list"></div>
        </div>

        <!-- Car Select / Race Config -->
        <div id="screen-carselect" class="hidden">
            <div class="screen-header">
                <button class="back-btn" id="carselect-back">←</button>
                <h2 id="carselect-title">SELECT YOUR CAR</h2>
            </div>
            <div id="car-carousel">
                <button id="car-prev">◀</button>
                <div id="car-display">
                    <div id="car-visual"></div>
                    <div id="car-name-display"></div>
                    <div id="car-stats-display"></div>
                </div>
                <button id="car-next">▶</button>
            </div>
            <div id="opponent-info"></div>
            <button class="menu-btn glow" id="btn-startrace">START RACE</button>
        </div>

        <!-- Garage -->
        <div id="screen-garage" class="hidden">
            <div class="screen-header">
                <button class="back-btn" id="garage-back">←</button>
                <h2>GARAGE</h2>
                <span id="garage-credits">★ <span id="credit-count">0</span></span>
            </div>
            <div id="garage-cars"></div>
        </div>

        <!-- Race Results -->
        <div id="screen-results" class="hidden">
            <div id="results-panel">
                <div id="results-title-wrap">
                    <div id="results-badge"></div>
                    <h2 id="results-title">RACE COMPLETE</h2>
                </div>
                <div id="results-table"></div>
                <div id="results-rewards"></div>
                <div id="results-buttons">
                    <button class="menu-btn" id="btn-retry">RETRY</button>
                    <button class="menu-btn glow" id="btn-continue">CONTINUE</button>
                </div>
            </div>
        </div>

        <!-- City Intro Banner -->
        <div id="city-banner" class="hidden">
            <div id="city-banner-inner">
                <div id="banner-city"></div>
                <div id="banner-track"></div>
                <div id="banner-laps"></div>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="screen-loading">
            <div id="loading-logo">RIFTLINE</div>
            <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
            <div id="loading-tip">Loading race data…</div>
        </div>
    </div>

    <!-- PlayCanvas Engine -->
    <script src="https://code.playcanvas.com/playcanvas-stable.min.js"></script>

    <!-- Game Scripts (order matters: data → generators → components → main) -->
    <script src="js/CareerManager.js"></script>
    <script src="js/TrackData.js"></script>
    <script src="js/TrackGenerator.js"></script>
    <script src="js/Checkpoint.js"></script>
    <script src="js/PowerUp.js"></script>
    <script src="js/UIManager.js"></script>
    <script src="js/GameManager.js"></script>
    <script src="js/CarController.js"></script>
    <script src="js/AIController.js"></script>
    <script src="js/CameraFollow.js"></script>
    <script src="js/AudioManager.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
